      const POSTHOG_PROJECT_TOKEN = "phc_x4f8nnybtCVSXC2iS8EUicQgVYvDcZFfDaVfc8ZqRzrP";
      const POSTHOG_API_HOST = "https://us.i.posthog.com";

  <body>
    <div class="page-shell">
    <header class="topbar">
      <div class="topbar__inner">
        <div class="title-row">
          <div>
            <h1>有道领世高考喜报素材库</h1>
            <p>按省份、学科快速筛选高考喜报素材，点击图片可预览，点击复制可直接复制图片。</p>
          </div>
          <div class="stats-pills">
            <span class="stats-pill"><strong id="totalYears">0</strong><em>年份</em></span>
            <span class="stats-pill"><strong id="totalImages">0</strong><em>张素材</em></span>
            <span class="stats-pill"><strong id="totalCategories">0</strong><em>类素材</em></span>
          </div>
        </div>

        <div class="filter-panel">
          <div class="filter-line">
            <span class="filter-label">年份</span>
            <select id="yearSelect" class="select-control year-select" aria-label="年份筛选">
              <option value="全部">全部</option>
              <option value="2025">2025</option>
            </select>
            <span class="filter-label">省份</span>
            <input
              id="provinceSelect"
              class="select-control province-select"
              type="text"
              list="provinceOptions"
              value="全部省份"
              placeholder="输入或选择省份"
              aria-label="输入或选择省份筛选"
              autocomplete="off"
            />
            <datalist id="provinceOptions">
              <option value="全部省份"></option>
            </datalist>
            <button id="resetButton" class="ghost-button" type="button">重置</button>
          </div>

          <div class="filter-line">
            <span class="filter-label">学科</span>
            <div id="subjectButtons" class="chip-group"></div>
          </div>

          <div id="filterSummary" class="filter-summary">当前筛选：2025｜全部省份｜全部学科｜共 0 张</div>
        </div>
      </div>
    </header>

    <main class="dashboard">
      <section class="year-head">
        <div>
          <h2 id="yearTitle">2025 高考喜报素材</h2>
          <p id="yearSubtitle">共 0 张素材，当前筛选 0 张</p>
        </div>
      </section>

      <section class="board-grid" aria-label="素材看板">
        <div class="board-column board-column--left">
          <div id="section-top-university"></div>
          <div id="section-ultra-high-score"></div>
        </div>
        <div class="board-column board-column--center">
          <div id="section-single-subject-high-score"></div>
          <div id="section-high-score-student"></div>
          <div id="section-score-improvement"></div>
        </div>
        <div class="board-column board-column--right">
          <div id="section-prediction-feedback"></div>
        </div>
      </section>
    </main>
    </div>

    <div id="viewAllModal" class="modal" hidden>
      <div class="modal__overlay" data-close-modal></div>
      <section class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="viewAllTitle">
        <div class="modal__header">
          <div>
            <h3 id="viewAllTitle">2025｜提分学员｜共 0 张</h3>
            <p id="viewAllSubtitle">当前筛选下的全部素材</p>
          </div>
          <button class="icon-button" type="button" data-close-modal aria-label="关闭">×</button>
        </div>
        <div id="viewAllGrid" class="modal-grid"></div>
        <div class="modal__footer">
          <button id="viewAllPrev" class="ghost-button" type="button">上一页</button>
          <span id="viewAllPageIndicator" class="modal-page-indicator">1 / 1</span>
          <button id="viewAllNext" class="primary-button" type="button">下一页</button>
          <button class="ghost-button" type="button" data-close-modal>关闭</button>
        </div>
      </section>
    </div>

    <div id="lightbox" class="lightbox" hidden>
      <div class="lightbox__backdrop"></div>
      <button id="lightboxCloseTop" class="lightbox__close" type="button" aria-label="关闭">×</button>
      <button id="lightboxPrev" class="lightbox__nav lightbox__nav--prev" type="button" aria-label="上一张">‹</button>
      <figure class="lightbox__content">
        <img id="lightboxImage" alt="" />
        <figcaption class="lightbox__caption">
          <div class="lightbox__meta">
            <strong id="lightboxTitle"></strong>
            <span id="lightboxFile"></span>
            <span id="lightboxTags"></span>
          </div>
          <div class="lightbox__actions">
            <button id="lightboxCopy" class="primary-button" type="button">复制图片</button>
            <a id="lightboxDownload" class="ghost-button" download>下载原图</a>
            <button id="lightboxCopyName" class="ghost-button" type="button">复制文件名</button>
            <button id="lightboxCloseBottom" class="ghost-button" type="button">关闭</button>
          </div>
        </figcaption>
      </figure>
      <button id="lightboxNext" class="lightbox__nav lightbox__nav--next" type="button" aria-label="下一张">›</button>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="./data.js"></script>
    <script src="./app.js?v=20260714-local-ui-5"></script>
  </body>
</html>
